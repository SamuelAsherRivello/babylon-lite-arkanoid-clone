schema: spec-driven
context: |
  Repository: babylon-lite-arkanoid-clone; display title: Neon Breaker Duo.
  Original portrait 2D online cooperative Arkanoid-inspired game for two players.
  Start from the GitHub repository template at e526677d65c6bacee5cddd17189213cf565d90c9
  and shared skills library at befef8e689341adf7b34ae89b9a665bc26ac1be8.
  Use React, Vite, Babylon Lite 1.32.0 and WebGPU. Keep the npm project at root
  and the Vite app under the renamed app directory. Preserve four template
  corner roles and local run/test/build scripts. Portrait stage 320x576, crisp
  nearest-sampled 2D art with integer scaling when it fits and documented
  fractional fit otherwise. Two players share one authoritative board, score,
  lives and progression; both paddles move freely across the full width and may overlap at fixed y=490 and y=440. The server
  validates bounded paddle input and owns simulation, collisions, bricks,
  powerups and match transitions. Shared-client state must be pinned to a
  verified released package. The sibling rmc-colyseus-multiplayer-server
  has released the full-width paddle game contract in v0.9.6; this app
  uses its verified v0.9.6 client release and isolated neon-breaker-duo room.
  GitHub Pages base is /babylon-lite-arkanoid-clone/; production backend URL
  is configurable and must use the public secure endpoint. No credentials in
  browser code. Anonymous identities are ephemeral; sessions are in-memory,
  may reset on deployment, and hosted sessions are short lived.
  Use authored original game artwork and board layouts. Keep the actual
  original user prompt separate from interpreted assumptions in the README.
rules:
  proposal:
    - State observable game and multiplayer behavior and acceptance criteria.
    - Mark unresolved decisions clearly; recommendations are not approvals.
  design:
    - Keep authoritative game rules independent from renderer and input.
    - Keep server authoritative simulation separate from Babylon Lite rendering.
  tasks:
    - Keep planning, server implementation, client implementation and verification explicit.
    - Include two-client local and public multiplayer verification.
